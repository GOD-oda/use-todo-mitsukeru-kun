on:
  workflow_dispatch:
  pull_request:
    types:
      - synchronize

jobs:
  test_job:
    runs-on: ubuntu-latest
    name: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use todo-mitsukeru-kun
        uses: GOD-oda/todo-mitsukeru-kun@test-json
        env:
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TARGET_DIR: "src"
          INPUT_ISSUE_LABELS: "todo,HOGE"
